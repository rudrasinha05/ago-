name: Next.js security lockfile refresh
on:
  push:
    branches: [develop]
    paths:
      - apps/web/package.json
      - apps/admin/package.json
      - apps/docs/package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nextjs-security-lock-develop
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Regenerate npm lockfile using authoritative package registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact patched Next.js for all workspaces and lock entries
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for (const name of ['apps/web','apps/admin','apps/docs']) {
            const manifest = JSON.parse(fs.readFileSync(name+'/package.json','utf8'));
            assert.equal(manifest.dependencies.next, '16.4.3', name + ' manifest');
            assert.equal(lock.packages[name].dependencies.next, '16.4.3', name + ' lock');
          }
          for (const [name,item] of Object.entries(lock.packages)) {
            if (name === 'node_modules/next' || name === 'node_modules/@next/env' ||
                name.startsWith('node_modules/@next/swc-')) {
              assert.equal(item.version,'16.4.3',name);
              assert.ok(item.integrity?.startsWith('sha512-'),name+' missing npm integrity');
              assert.ok(item.resolved?.startsWith('https://registry.npmjs.org/'),name+' untrusted registry');
            }
          }
          NODE
      - name: Verify lockfile works with immutable npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic lockfile only if newer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): resolve Next.js 16.4.3 lockfile via npm registry"
            git push origin HEAD:develop
          fi
