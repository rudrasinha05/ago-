name: Backend quality
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e './apps/backend[dev]'
      - name: Tests
        run: python -m pytest -q apps/backend/tests
      - name: Lint
        run: python -m ruff check apps/backend/ago apps/backend/tests
