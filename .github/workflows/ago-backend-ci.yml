name: AGO Backend CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  foundation-and-m2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ago_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ago_test -d ago_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      AGO_POSTGRES_DSN: postgresql://ago_test:ci_only_password@localhost:5432/ago_test
      AGO_TEST_POSTGRES_DSN: postgresql://ago_test:ci_only_password@localhost:5432/ago_test
      AGO_SESSION_SECRET: ci_only_signing_key_change_outside_ci_123456789
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"
      - name: Apply PostgreSQL migrations
        id: migration
        run: python -m ago.event_runtime migrate
      - name: Lint
        id: lint
        run: python -m ruff check ago tests
      - name: Run unit and PostgreSQL integration tests
        id: tests
        run: python -m pytest -q
      - name: Report CI result to commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_STATUS: ${{ job.status }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          MIGRATION_RESULT: ${{ steps.migration.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          if [ "$RUN_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" --method POST \
            -f state="$STATE" -f context="ago/m2/i=$INSTALL_RESULT/d=$MIGRATION_RESULT/l=$LINT_RESULT/t=$TEST_RESULT" \
            -f description="CI $RUN_STATUS install:$INSTALL_RESULT db:$MIGRATION_RESULT lint:$LINT_RESULT tests:$TEST_RESULT"
