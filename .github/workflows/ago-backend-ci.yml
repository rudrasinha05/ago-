name: AGO Architecture Sections 1-5 & 14 and M1-M12 CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  foundation-through-m12:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ago_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ago_test -d ago_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      AGO_POSTGRES_DSN: postgresql://ago_test:ci_only_password@localhost:5432/ago_test
      AGO_TEST_POSTGRES_DSN: postgresql://ago_test:ci_only_password@localhost:5432/ago_test
      AGO_SESSION_SECRET: ci_only_signing_key_change_outside_ci_123456789
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"
      - name: Verify console assets in packaged wheel
        id: wheel
        run: |
          python -m pip wheel . --no-deps -w /tmp/ago-wheels
          python -c 'from pathlib import Path; import zipfile; w=next(Path("/tmp/ago-wheels").glob("ago_backend-*.whl")); z=zipfile.ZipFile(w); a={"index.html","styles.css","core.js","views.js","actions.js","app.js"}; assert {"ago/console/"+p for p in a} | {"ago/architecture_policy.json"} <= set(z.namelist()), "Missing packaged console or architecture contract"'
      - name: Enforce Section 14 module architecture and export dependency graph
        id: architecture
        run: python -m ago.architecture_guard check --json --dot section14-dependency-graph.dot
      - name: Retain reviewable module dependency graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ago-section14-dependency-graph-py${{ matrix.python }}
          path: apps/backend/section14-dependency-graph.dot
          retention-days: 30
          if-no-files-found: ignore
      - name: Enforce Section 1 system architecture traceability
        run: python ../../scripts/check_system_architecture.py
      - name: Enforce Section 2 component diagrams and source evidence
        run: python ../../scripts/check_component_diagrams.py
      - name: Parse all six Section 2 Mermaid component views
        run: |
          npm install --prefix /tmp/ago-diagram-check mermaid@11.12.0 jsdom@26.1.0 --no-audit --no-fund
          node ../../scripts/check_component_mermaid.mjs /tmp/ago-diagram-check/node_modules
      - name: Enforce Section 3 domain context and SQL boundaries
        run: python ../../scripts/check_domain_contexts.py
      - name: Enforce Section 4 monorepo boundaries
        run: python ../../scripts/check_monorepo.py
      - name: Enforce Section 5 backend ports and strict layers
        run: python ../../scripts/check_backend_architecture.py
      - name: Apply PostgreSQL migrations
        id: migration
        run: python -m ago.event_runtime migrate
      - name: Confirm local operator doctor and tenant lookup
        id: operator
        run: |
          python -m ago.local_ops doctor
          python -m ago.local_ops tenants
      - name: Lint
        id: lint
        run: python -m ruff check ago tests tests_browser ../../scripts/check_system_architecture.py ../../scripts/check_component_diagrams.py ../../scripts/check_domain_contexts.py ../../scripts/check_monorepo.py ../../scripts/smoke_workspace_exports.py ../../scripts/check_backend_architecture.py
      - name: Validate first-party console JS and UI unit tests
        id: javascript
        run: |
          for file in ago/console/{core,views,actions,app}.js; do node --check "$file"; done
          node --test tests_web/*.test.mjs
      - name: Run unit and PostgreSQL integration tests
        id: tests
        run: python -m pytest -q
      - name: Report CI result to commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          RUN_STATUS: ${{ job.status }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          MIGRATION_RESULT: ${{ steps.migration.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          JS_RESULT: ${{ steps.javascript.outcome }}
          WHEEL_RESULT: ${{ steps.wheel.outcome }}
          OPERATOR_RESULT: ${{ steps.operator.outcome }}
          ARCHITECTURE_RESULT: ${{ steps.architecture.outcome }}
        run: |
          if [ "$RUN_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" --method POST \
            -f state="$STATE" -f context="ago/m1-m12/py${{ matrix.python }}/i=$INSTALL_RESULT/w=$WHEEL_RESULT/a=$ARCHITECTURE_RESULT/o=$OPERATOR_RESULT/d=$MIGRATION_RESULT/l=$LINT_RESULT/j=$JS_RESULT/t=$TEST_RESULT" \
            -f description="CI $RUN_STATUS architecture:$ARCHITECTURE_RESULT db:$MIGRATION_RESULT js:$JS_RESULT tests:$TEST_RESULT" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/$CI_RUN_ID"

  release-image-smoke:
    name: M10 Nonroot Image Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Build deploy artifact
        run: docker build -f deploy/docker/Dockerfile -t ago-m10:ci .
      - name: Verify non-root runtime and fail-closed production default
        run: |
          set -euo pipefail
          test "$(docker image inspect ago-m10:ci --format '{{.Config.User}}')" = "10001:10001"
          docker image inspect ago-m10:ci --format '{{json .Config.Env}}' | grep -q 'AGO_ENVIRONMENT=production'
      - name: Smoke first-party UI and health in isolated loopback-only preview
        run: |
          set -euo pipefail
          docker run --rm -d --name ago-m10-smoke -p 127.0.0.1:18765:8000 \
            --read-only --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=128 --memory=512m \
            -e AGO_ENVIRONMENT=development \
            -e AGO_ENABLE_PAID_MODELS=false \
            -e AGO_M8_EXTERNAL_ENABLED=false ago-m10:ci
          trap 'docker logs ago-m10-smoke --tail=30 || true; docker stop ago-m10-smoke || true' EXIT
          passed=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18765/health/live >/dev/null; then
              passed=1
              break
            fi
            sleep 1
          done
          test "$passed" = "1"
          curl --retry 5 --retry-connrefused --retry-delay 1 -fsS -o /tmp/ago-console-smoke.html http://127.0.0.1:18765/console/
          grep -q 'login-form' /tmp/ago-console-smoke.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/v1/console/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/health/ready)" = "503"
      - name: Publish image gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_STATUS: ${{ job.status }}
        run: |
          if [ "$RUN_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" --method POST \
            -f state="$STATE" -f context="ago/m10/nonroot-image=$RUN_STATUS" \
            -f description="M10 Docker runtime image and isolated HTTP smoke $RUN_STATUS" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  disaster-recovery-drill:
    name: M10 PostgreSQL Backup & Restore
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      statuses: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ago_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ago_test -d ago_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      AGO_POSTGRES_DSN: postgresql://ago_test:ci_only_password@localhost:5432/ago_test
      AGO_RESTORE_TEST_DSN: postgresql://ago_test:ci_only_password@localhost:5432/ago_restore_drill
      PGPASSWORD: ci_only_password
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install trusted PostgreSQL command-line client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version
          pg_restore --version
      - name: Install AGO backend
        run: python -m pip install -e '.[postgres]'
      - name: Apply source migrations
        run: python -m ago.event_runtime migrate
      - name: Create isolated empty drill target
        run: psql -h localhost -U ago_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ago_restore_drill'
      - name: Backup, verify manifest and restore with real PostgreSQL tools
        run: |
          python -m ago.release_ops backup --output /tmp/ago-m10-ci.dump --confirm
          python -m ago.release_ops verify-backup --archive /tmp/ago-m10-ci.dump
          python -m ago.release_ops restore-drill --archive /tmp/ago-m10-ci.dump --confirm
      - name: Publish verified disaster recovery gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_STATUS: ${{ job.status }}
        run: |
          if [ "$RUN_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" --method POST \
            -f state="$STATE" -f context="ago/m10/restore-drill=$RUN_STATUS" \
            -f description="Actual PostgreSQL dump, checksum and isolated restore $RUN_STATUS" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  pilot-browser-chromium:
    name: M11 Real Chromium Pilot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ago_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ago_test -d ago_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      AGO_ENVIRONMENT: development
      AGO_POSTGRES_DSN: postgresql://ago_test:ci_only_password@localhost:5432/ago_test
      AGO_TEST_POSTGRES_DSN: postgresql://ago_test:ci_only_password@localhost:5432/ago_test
      AGO_SESSION_SECRET: ci_only_signing_key_change_outside_ci_123456789
      AGO_ENABLE_PAID_MODELS: "false"
      AGO_M8_EXTERNAL_ENABLED: "false"
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AGO and pinned Chromium test runner
        run: |
          python -m pip install -e ".[dev,postgres]"
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Apply verified SQL migrations
        run: python -m ago.event_runtime migrate
      - name: Execute complete independent Chromium journeys
        id: browser
        run: |
          python -m pytest -q tests_browser
      - name: Retain pilot screenshots (disposable test accounts only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ago-m11-pilot-chromium
          path: apps/backend/tests_browser/artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Report browser acceptance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_STATUS: ${{ job.status }}
        run: |
          if [ "$RUN_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" --method POST \
            -f state="$STATE" -f context="ago/m11/real-chromium=$RUN_STATUS" \
            -f description="AGO M11 Chromium eight-page pilot, reviewer RBAC, mobile and simulation $RUN_STATUS" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  monorepo-shells:
    name: Section 4 Next.js Workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible workspace lockfile
        run: npm ci --no-audit --no-fund
      - name: Check workspace ownership and coupling
        run: python scripts/check_monorepo.py
      - name: SDK origin and privacy regression
        run: npm test
      - name: Build all Next.js application shells
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Serve actual exports and verify all workspace homepages
        run: python scripts/smoke_workspace_exports.py
